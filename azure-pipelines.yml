parameters:
- name: environment
  displayName: "Choose Environment"
  type: string
  default: nonprod
  values:
  - nonprod
  - prod

- name: action
  displayName: "Choose Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

trigger:
- main

variables:
  TF_ENV: ${{ parameters.environment }}
  TF_ACTION: ${{ parameters.action }}

jobs:
- deployment: terraform_all_in_one
  displayName: "Terraform Plan → Approval → Apply/Destroy"
  environment: terraform-${{ parameters.environment }}   
  pool:
    vmImage: ubuntu-latest

  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self

        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'

        - task: TerraformCLI@1
          displayName: "Terraform Init"
          inputs:
            command: 'init'
            workingDirectory: 'terraform'
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

        # ---------- PLAN ----------
        - task: TerraformCLI@1
          displayName: "Terraform Plan (Apply)"
          condition: eq(variables['TF_ACTION'], 'apply')
          inputs:
            command: 'plan'
            workingDirectory: 'terraform'
            commandOptions: >
              -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
              -out=tfplan
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

        - task: TerraformCLI@1
          displayName: "Terraform Plan (Destroy)"
          condition: eq(variables['TF_ACTION'], 'destroy')
          inputs:
            command: 'plan'
            workingDirectory: 'terraform'
            commandOptions: >
              -destroy
              -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
              -out=tfdestroyplan
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

        # ---------- APPLY / DESTROY ----------
        - task: TerraformCLI@1
          displayName: "Terraform Apply"
          condition: eq(variables['TF_ACTION'], 'apply')
          inputs:
            command: 'apply'
            workingDirectory: 'terraform'
            commandOptions: >
              -auto-approve tfplan
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

        - task: TerraformCLI@1
          displayName: "Terraform Destroy"
          condition: eq(variables['TF_ACTION'], 'destroy')
          inputs:
            command: 'apply'
            workingDirectory: 'terraform'
            commandOptions: >
              -auto-approve tfdestroyplan
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
