parameters:
- name: environment
  displayName: "Choose Environment"
  type: string
  default: nonprod
  values:
  - nonprod
  - prod

- name: action
  displayName: "Choose Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

trigger:
- main

variables:
  TF_ENV: ${{ parameters.environment }}
  TF_ACTION: ${{ parameters.action }}
  TF_VERSION: "latest"

stages:
# =========================
# STAGE 1: PLAN
# =========================
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: terraform_plan
    displayName: "Init + Plan"
    pool:
      name: Default



    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformCLI@1
      displayName: "Terraform Init"
      inputs:
        command: 'init'
        workingDirectory: 'terraform'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # ---------- PLAN ----------
    - task: TerraformCLI@1
      displayName: "Terraform Plan (Apply)"
      condition: eq(variables['TF_ACTION'], 'apply')
      inputs:
        command: 'plan'
        workingDirectory: 'terraform'
        commandOptions: >
          -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
          -out=tfplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    - task: TerraformCLI@1
      displayName: "Terraform Plan (Destroy)"
      condition: eq(variables['TF_ACTION'], 'destroy')
      inputs:
        command: 'plan'
        workingDirectory: 'terraform'
        commandOptions: >
          -destroy
          -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
          -out=tfdestroyplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)


    - task: PublishPipelineArtifact@1
      displayName: "Publish apply plan"
      condition: eq(variables['TF_ACTION'], 'apply')
      inputs:
        targetPath: 'terraform/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: "Publish destroy plan"
      condition: eq(variables['TF_ACTION'], 'destroy')
      inputs:
        targetPath: 'terraform/tfdestroyplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'


# =========================
# STAGE 2: APPROVAL + APPLY/DESTROY
# =========================
- stage: Apply
  displayName: "Approval → Apply/Destroy"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: terraform_apply_destroy
    displayName: "Terraform Apply/Destroy (gated by Environment approvals)"
    environment: terraform-${{ parameters.environment }}
    pool:
      name: Default

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(TF_VERSION)'

          - task: TerraformCLI@1
            displayName: "Terraform Init"
            inputs:
              command: 'init'
              workingDirectory: 'terraform'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          # ---------- APPLY / DESTROY (from the saved plan) ----------
          - task: TerraformCLI@1
            displayName: "Terraform Apply (from plan)"
            condition: eq(variables['TF_ACTION'], 'apply')
            inputs:
              command: 'apply'
              workingDirectory: 'terraform'
              commandOptions: >
                -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - task: TerraformCLI@1
            displayName: "Terraform Destroy (from plan)"
            condition: eq(variables['TF_ACTION'], 'destroy')
            inputs:
              command: 'apply'
              workingDirectory: 'terraform'
              commandOptions: >
                -auto-approve "$(Pipeline.Workspace)/tfplan/tfdestroyplan"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

# =========================
# STAGE 3: HELM INSTALL
# =========================
- stage: Helm_Install
  displayName: "Helm Install (aws-lbc + ingress-nginx + TGB)"
  dependsOn: Apply
  condition: and(succeeded(), eq(variables['TF_ACTION'], 'apply'))

  jobs:
  - job: helm_install
    displayName: "Install Controllers + Binding"
    pool:
      name: Default

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformCLI@1
      displayName: "Terraform Init (for outputs)"
      inputs:
        command: 'init'
        workingDirectory: 'terraform'
        commandOptions: '-reconfigure'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # -------------------------
    # Export Terraform outputs to pipeline variables
    # -------------------------
    - task: Bash@3
      displayName: "Read Terraform outputs (cluster name + TG ARN + API)"
      inputs:
        targetType: 'inline'
        script: |
          set -euo pipefail
          cd terraform

          terraform output -json > /tmp/tfouts.json

          # ===== existing outputs =====
          CLUSTER_NAME="$(jq -r '.eks_cluster_name.value // empty' /tmp/tfouts.json)"
          TG_ARN="$(jq -r '.nlb_target_group_arn.value // empty' /tmp/tfouts.json)"
          API_ENDPOINT="$(jq -r '.api_endpoint.value // empty' /tmp/tfouts.json)"

          # ===== NEW: IRSA role for AWS LBC =====
          LBC_ROLE_ARN="$(jq -r '.alb_controller_irsa_role_arn.value // empty' /tmp/tfouts.json)"

          echo "Cluster: ${CLUSTER_NAME}"
          echo "TG ARN:  ${TG_ARN}"
          echo "API:     ${API_ENDPOINT}"
          echo "LBC Role ARN: ${LBC_ROLE_ARN}"

          if [ -z "${CLUSTER_NAME}" ]; then
            echo "ERROR: eks_cluster_name output missing"
            exit 1
          fi

          if [ -z "${TG_ARN}" ]; then
            echo "ERROR: nlb_target_group_arn output missing"
            exit 1
          fi

          if [ -z "${LBC_ROLE_ARN}" ]; then
            echo "ERROR: alb_controller_irsa_role_arn output missing"
            exit 1
          fi

          echo "##vso[task.setvariable variable=EKS_CLUSTER_NAME]${CLUSTER_NAME}"
          echo "##vso[task.setvariable variable=NLB_TG_ARN]${TG_ARN}"
          echo "##vso[task.setvariable variable=API_ENDPOINT]${API_ENDPOINT}"
          echo "##vso[task.setvariable variable=LBC_ROLE_ARN]${LBC_ROLE_ARN}"
      env:
        TF_ENV: $(TF_ENV)
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # -------------------------
    # kubeconfig
    # -------------------------
    - task: Bash@3
      displayName: "Configure kubeconfig for EKS"
      inputs:
        targetType: 'inline'
        script: |
         set -euo pipefail
         echo "Using cluster: '$(EKS_CLUSTER_NAME)' region: '$(AWS_DEFAULT_REGION)'"
   
         aws eks update-kubeconfig \
           --name "$(EKS_CLUSTER_NAME)" \
           --region "$(AWS_DEFAULT_REGION)"
   
         kubectl get nodes -o wide
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # -------------------------
    # Install AWS Load Balancer Controller
    # Assumes Terraform created the ServiceAccount with IRSA:
    # kube-system/aws-load-balancer-controller
    # -------------------------
    - task: Bash@3
      displayName: "Install aws-load-balancer-controller (Helm)"
      inputs:
        targetType: 'inline'
        script: |
         set -euo pipefail
          
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName="$(EKS_CLUSTER_NAME)" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$(LBC_ROLE_ARN)" \
            --wait --timeout 10m
          
          kubectl -n kube-system get sa aws-load-balancer-controller -o yaml | grep -i role-arn
          kubectl -n kube-system get deploy aws-load-balancer-controller
          kubectl get crd | grep targetgroupbindings || true
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # -------------------------
    # Install ingress-nginx
    # -------------------------
    - task: Bash@3
      displayName: "Install ingress-nginx (Helm)"
      inputs:
        targetType: 'inline'
        script: |
          set -e

          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx --create-namespace \
            --set controller.service.type=ClusterIP \
            --wait --timeout 10m

          kubectl -n ingress-nginx get svc ingress-nginx-controller
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # -------------------------
    # Apply TargetGroupBinding
    # -------------------------
    - task: Bash@3
      displayName: "Apply TargetGroupBinding (NLB TG -> ingress-nginx svc)"
      inputs:
        targetType: 'inline'
        script: |
          set -e

          cat > tgb.yaml <<EOF
          apiVersion: elbv2.k8s.aws/v1beta1
          kind: TargetGroupBinding
          metadata:
            name: ingress-nlb-tgb
            namespace: ingress-nginx
          spec:
            targetGroupARN: $(NLB_TG_ARN)
            targetType: ip
            serviceRef:
              name: ingress-nginx-controller
              port: 80
          EOF

          kubectl apply -f tgb.yaml

          kubectl -n ingress-nginx get targetgroupbinding ingress-nlb-tgb -o wide
          kubectl -n ingress-nginx describe targetgroupbinding ingress-nlb-tgb | sed -n '/Events/,$p'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          

 