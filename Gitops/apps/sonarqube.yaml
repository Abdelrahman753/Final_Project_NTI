apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "10.6.0"
    helm:
      values: |
        # ---- Disable persistence completely ----
        persistence:
          enabled: false
    
        # Some chart templates still mount PVC unless this is empty/false
        sonarWebContext: /sonar
    
        service:
          type: ClusterIP
    
        # ---- Use embedded H2 (test only) by disabling PostgreSQL ----
        postgresql:
          enabled: false
    
        # ---- Fix base URL ----
        sonarProperties:
          sonar.web.context: /sonar
          sonar.core.serverBaseURL: https://qj6jvlfmgh.execute-api.us-east-1.amazonaws.com/sonar
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true