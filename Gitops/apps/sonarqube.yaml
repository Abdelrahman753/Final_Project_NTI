apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "10.6.0"
    helm:
      values: |
        # --- SonarQube persistence on gp3 ---
        persistence:
          enabled: true
          storageClass: gp3
          size: 2Gi

        service:
          type: ClusterIP

        # --- PostgreSQL (Bitnami) persistence on gp3 + force PG15 image ---
        postgresql:
          enabled: true

          primary:
            image:
              registry: docker.io
              repository: bitnami/postgresql
              tag: 15.5.0-debian-12-r0
            persistence:
              enabled: true
              storageClass: gp3
              size: 2Gi

          auth:
            username: sonar
            database: sonar
            password: "abdo" 

        sonarWebContext: /sonar
        sonarProperties:
          sonar.core.serverBaseURL: https://qj6jvlfmgh.execute-api.us-east-1.amazonaws.com/sonar

        ingress:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true