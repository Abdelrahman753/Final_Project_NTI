apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "10.6.0"
    helm:
      values: |
        persistence:
          enabled: true
          storageClass: gp3
          size: 5Gi

        service:
          type: ClusterIP

        # Enable bundled PostgreSQL (nonprod)
        postgresql:
          enabled: true
          persistence:
            enabled: true
            storageClass: gp3
            size: 1Gi

        sonarProperties:
          sonar.web.context: /sonar
          sonar.core.serverBaseURL: https://YOUR_API_GATEWAY_ENDPOINT/sonar

        ingress:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true