apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: "0.24.0"
    helm:
      values: |
        operator:
          scanJobsConcurrentLimit: 5

        trivy:
          ignoreUnfixed: true
          severity: HIGH,CRITICAL

        serviceMonitor:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: trivy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true