parameters:
- name: environment
  displayName: "Choose Environment"
  type: string
  default: nonprod
  values:
  - nonprod
  - prod

- name: action
  displayName: "Choose Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

trigger:
- main

variables:
  TF_ENV: ${{ parameters.environment }}
  TF_ACTION: ${{ parameters.action }}
  TF_VERSION: "latest"

stages:
# =========================
# STAGE 1: PLAN
# =========================
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: terraform_plan
    displayName: "Init + Plan"
    pool:
      name: default

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(TF_VERSION)'

    - task: TerraformCLI@1
      displayName: "Terraform Init"
      inputs:
        command: 'init'
        workingDirectory: 'terraform'
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    # ---------- PLAN ----------
    - task: TerraformCLI@1
      displayName: "Terraform Plan (Apply)"
      condition: eq(variables['TF_ACTION'], 'apply')
      inputs:
        command: 'plan'
        workingDirectory: 'terraform'
        commandOptions: >
          -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
          -out=tfplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

    - task: TerraformCLI@1
      displayName: "Terraform Plan (Destroy)"
      condition: eq(variables['TF_ACTION'], 'destroy')
      inputs:
        command: 'plan'
        workingDirectory: 'terraform'
        commandOptions: >
          -destroy
          -var-file="$(System.DefaultWorkingDirectory)/terraform/$(TF_ENV)/$(TF_ENV).tfvars"
          -out=tfdestroyplan
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)


    - task: PublishPipelineArtifact@1
      displayName: "Publish apply plan"
      condition: eq(variables['TF_ACTION'], 'apply')
      inputs:
        targetPath: 'terraform/tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: "Publish destroy plan"
      condition: eq(variables['TF_ACTION'], 'destroy')
      inputs:
        targetPath: 'terraform/tfdestroyplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'


# =========================
# STAGE 2: APPROVAL + APPLY/DESTROY
# =========================
- stage: Apply
  displayName: "Approval → Apply/Destroy"
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - deployment: terraform_apply_destroy
    displayName: "Terraform Apply/Destroy (gated by Environment approvals)"
    environment: terraform-${{ parameters.environment }}
    pool:
      name: default

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(TF_VERSION)'

          - task: TerraformCLI@1
            displayName: "Terraform Init"
            inputs:
              command: 'init'
              workingDirectory: 'terraform'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          # ---------- APPLY / DESTROY (from the saved plan) ----------
          - task: TerraformCLI@1
            displayName: "Terraform Apply (from plan)"
            condition: eq(variables['TF_ACTION'], 'apply')
            inputs:
              command: 'apply'
              workingDirectory: 'terraform'
              commandOptions: >
                -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - task: TerraformCLI@1
            displayName: "Terraform Destroy (from plan)"
            condition: eq(variables['TF_ACTION'], 'destroy')
            inputs:
              command: 'apply'
              workingDirectory: 'terraform'
              commandOptions: >
                -auto-approve "$(Pipeline.Workspace)/tfplan/tfdestroyplan"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

# =========================
# STAGE 3: HELM INSTALL
# =========================
- stage: Helm_Install
  displayName: "Helm Install (ArgoCD, Nexus, Vault, etc.)"
  dependsOn: Apply
  condition: succeeded()

  jobs:
  - job: helm_install
    displayName: "Install Tools via Helm"
    pool:
      name: default

    steps:
    - checkout: self

    # ---------- Configure kubeconfig ----------
    - task: Bash@3
      displayName: "Configure kubeconfig for EKS"
      inputs:
        targetType: 'inline'
        script: |
          aws eks update-kubeconfig \
            --name nonprod-eks-cluster \
            --region $AWS_DEFAULT_REGION


    # ---------- Install ArgoCD ----------
    - task: HelmDeploy@0
      displayName: "Install ArgoCD via Helm plugin"
      inputs:
        connectionType: 'None'
        command: 'upgrade'
        chartType: 'Name'
        chartName: 'argo/argo-cd'
        releaseName: 'argocd'
        namespace: 'argocd'
        createNamespace: true
        install: true
        valueFile: '' 
        arguments: '--repo https://argoproj.github.io/argo-helm'

